name: Automotive CAN SIL Testing Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run CAN Bus Simulation
      run: |
        # Rulăm simularea în fundal timp de 5 secunde pentru a genera log-ul can_trace.csv
        python can_network_sim.py &
        SIM_PID=$!
        sleep 5
        kill $SIM_PID || true

    - name: Run Automated Requirements Tests
      run: |
        pytest test_can_suite.py -v